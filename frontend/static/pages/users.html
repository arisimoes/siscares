<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisCares - Administrativo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">SisCares</div>
        <div class="menu">
            <a href="/static/pages/index.html" class="btn">Painel</a>
            <button onclick="logout()">Sair</button>
        </div>
    </nav>
    <main class="dashboard">
        <h2>Administrativo da Escola</h2>
        <form id="userForm" class="form-card">
            <input type="hidden" id="userId">
            <label for="full_name">Nome completo</label>
            <input type="text" id="full_name" required>

            <label for="email">Login</label>
            <input type="text" id="email" required>

            <label for="role">Função</label>
            <select id="role" required onchange="togglePermissionBtn()">
                <option value="staff">Administrativo</option>
                <option value="secretary">Secretaria</option>
            </select>

            <label for="password">Senha</label>
            <input type="password" id="password">
            <small>Preencha apenas para cadastrar novo usuário ou alterar a senha.</small>

            <button type="button" id="permBtn" class="btn-secondary" onclick="openPermissionsModal()">Permissões</button>

            <div class="form-actions">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelBtn" class="btn-secondary" onclick="resetForm()">Cancelar</button>
            </div>
        </form>

        <!-- Modal de Permissões -->
        <div id="permissionsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="closePermissionsModal()">&times;</span>
                <h3>Permissões do Usuário</h3>
                <p>Marque os módulos que este usuário poderá acessar.</p>
                <div class="permissions-list">
                    <label><input type="checkbox" id="perm_classes"> Turmas e Turnos</label>
                    <label><input type="checkbox" id="perm_students"> Alunos</label>
                    <label><input type="checkbox" id="perm_cards"> Carteirinhas</label>
                    <label><input type="checkbox" id="perm_attendance"> Chamada QR</label>
                    <label><input type="checkbox" id="perm_reports"> Relatórios</label>
                    <label><input type="checkbox" id="perm_transfers"> Transferências</label>
                    <label><input type="checkbox" id="perm_users"> Administrativo</label>
                    <label><input type="checkbox" id="perm_calendar"> Calendário</label>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="savePermissionsFromModal()">OK</button>
                </div>
            </div>
        </div>

        <table id="usersTable" class="data-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Função</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="/static/js/api.js?v=18"></script>
    <script src="/static/js/users.js?v=3"></script>
</body>
</html>
