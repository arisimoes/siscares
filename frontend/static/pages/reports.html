<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisCarEs - Relatórios</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <img src="/static/img/logo-siscares.svg" alt="" class="nav-logo">
            <span>SisCarEs</span>
        </div>
        <div class="menu">
            <a href="/static/pages/index.html" class="btn">Painel</a>
            <button onclick="logout()">Sair</button>
        </div>
    </nav>
    <main class="dashboard">
        <h2>Relatório de Frequência</h2>
        <div class="filters no-print">
            <label>Ano letivo:
                <select id="filterYear">
                    <option value="">Todos</option>
                </select>
            </label>
            <label>Mês: <input type="month" id="month" value="2026-07"></label>
            <label>Turma:
                <select id="filterClass">
                    <option value="">Todas</option>
                </select>
            </label>
            <label>Dia: <input type="date" id="filterDay"></label>
            <label>Aluno: <input type="text" id="filterStudent" placeholder="Nome do aluno"></label>
            <label>Bolsa Família:
                <select id="filterBolsa">
                    <option value="">Nenhum</option>
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                </select>
            </label>
            <button onclick="loadReport()">Gerar</button>
            <button class="btn-secondary" onclick="window.print()">Imprimir</button>
        </div>

        <div id="printHeader" class="print-only">
            <h2>Relatório de Frequência</h2>
            <p id="printFilters"></p>
        </div>

        <table id="reportTable" style="display:none">
            <thead>
                <tr><th>Turma</th><th>Aluno</th><th>Total</th><th>Presenças</th><th>Faltas</th><th>Justificadas</th><th>%</th></tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </main>

    <script src="/static/js/api.js?v=11"></script>
    <script src="/static/js/reports.js?v=11"></script>
</body>
</html>
