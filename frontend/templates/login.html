<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisCarEs - Login</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-brand">
            <img src="/static/img/logo-siscares.svg" alt="SisCarEs" class="login-logo-img">
            <h1>SisCarEs</h1>
            <p>Sistema de Carteirinha Escolar &amp; Controle de Frequência</p>
        </div>

        <div class="login-card">
            <h2>Acessar o sistema</h2>
            <form id="loginForm">
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="email" name="email" placeholder="Login" required autofocus>
                </div>

                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Senha" required>
                </div>

                <button type="submit" class="login-btn">Entrar</button>
            </form>
            <p id="errorMsg" class="error"></p>
        </div>

        <p class="login-footer">© SisCarEs — Gestão escolar inteligente</p>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
